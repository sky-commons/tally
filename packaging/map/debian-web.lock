# ones and all they depend on, at the versions DEBIAN_SNAPSHOT has, for amd64 and arm64 alike.
# debian-install.sh checks the install against this list, and installs exactly this list from
# Debian's mirrors when the snapshot is down. A pin or the snapshot moves, this list moves: the
# build that fails prints the new one.
