# nginx for the map image (RFC-0187 §1): tar1090 at /, readsb's JSON at /data/, the globe history
# at /globe_history/. The locations, their caching and their encodings are tar1090's own
# nginx-tar1090.conf at the pinned commit, installed at the web root (install.sh's "webroot"
# instance: /INSTANCE removed, SOURCE_DIR /run/readsb, HTMLPATH the installed html). Left out:
# /chunks/ (tar1090's history chunks, which a globe-indexed readsb replaces; the page's one probe
# of chunks/chunks.json is answered 404 and it carries on), /aircraft_sil/ and the offline tiles,
# which this image does not install, and the conf's rewrite of /globe_history/YYYY-MM-DD/ to
# YYYY/MM/DD/: tar1090 at the pinned commit asks for YYYY/MM/DD/ itself, and the rewrite's
# unanchored pattern would carry a `..` past nginx's normalisation into the alias.
#
# What it sends is bounded by the operator's ceiling, TALLY_MAP_MAX_UPLOAD: entrypoint.sh derives
# each class's slots and rate from it and writes them to /run/tally-map, which this includes, so no
# figure of bytes is set here. The server's own class (the page) is every location's unless the
# location names another, so nothing it serves is outside the ceiling.
#
# Link previews (RFC-0187 §3): the short links (/<hex>, /<registration>, /<lat>,<lon>[,<zoom>])
# redirect to tar1090's own query, and index.html asked for one aircraft (?icao= or ?reg=) carries
# the Open Graph tags preview.lua writes from readsb's answer for it, as adsb.lol's map does. Their
# picture is /preview/, which preview.py draws over OpenStreetMap's tiles, fetched and cached by the
# tile server below, or the site's card when there is no aircraft to draw.
#
# It runs as the image's user, not root, so everything it writes is under /run/tally-map, and
# entrypoint.sh starts it with `-e stderr` so it never opens Debian's root-owned log file.

# Debian's modules, loaded by path: this config is not Debian's nginx.conf, which includes them.
load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;

worker_processes auto;
pid /run/tally-map/nginx.pid;
error_log stderr warn;
# The page's title, which a preview names its site by, and the map's public origin, which its links
# start with (preview.lua).
env TALLY_MAP_TITLE;
env TALLY_MAP_URL;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # The map polls every second; a line a request would drown the log.
    access_log off;

    client_body_temp_path /run/tally-map/client_body;
    proxy_temp_path /run/tally-map/proxy;
    fastcgi_temp_path /run/tally-map/fastcgi;
    uwsgi_temp_path /run/tally-map/uwsgi;
    scgi_temp_path /run/tally-map/scgi;

    # What tar1090's conf switches on with `gzip on` is JSON; the files it marks gzip off are
    # already compressed (readsb's binCraft and traces, the database's .js), sent as they are.
    gzip_types application/json application/javascript text/css text/plain;
    gzip_vary on;

    # The zones, who a client is (realip, behind a trusted proxy), and the archive's gate
    # (entrypoint.sh).
    include /run/tally-map/limits.conf;
    # A client over its rate is told 429; a class (or a client's share of it) with every slot busy
    # is 503. Each says when to come back (Retry-After, below). A refusal is logged at info, under
    # error_log's warn, since a scraper refused every second would drown the log.
    limit_req_status 429;
    limit_conn_status 503;
    limit_req_log_level info;
    limit_conn_log_level info;
    map $uri $retry_after {
        ~^/archive/ 60;
        ~^/globe_history/ 5;
        default 1;
    }

    # Closed (TALLY_MAP_ARCHIVE_PUBLIC=off), /archive/ is answered 404 without the token, and the
    # 404 is kept by no cache, so a cached refusal is never served to the release job that holds it.
    map "$archive_token_ok$uri" $archive_denied {
        default 0;
        ~^0/archive/ 1;
    }
    map $archive_denied $archive_denied_cache {
        1 no-store;
        default "";
    }

    # The short links, adsb.lol's (tally.skycommons.org/<path> hands off here), with or without a
    # trailing slash: the target in tar1090's own query, or empty for any other path. A hex may be
    # tar1090's ~hex (an address that is not ICAO's); a place is a latitude to 90, a longitude to
    # 180 and a zoom to 20; tar1090 reads the hex and the registration in either case.
    map $uri $short_link {
        default "";
        "~^/(?<short_hex>~?[0-9A-Fa-f]{6})/?$" "/?icao=$short_hex";
        "~^/(?<short_lat>-?(90(\.0+)?|[1-8]?\d(\.\d+)?)),(?<short_lon>-?(180(\.0+)?|1[0-7]\d(\.\d+)?|[1-9]?\d(\.\d+)?)),(?<short_zoom>(20(\.0+)?|1?\d(\.\d+)?))/?$" "/?lat=$short_lat&lon=$short_lon&zoom=$short_zoom";
        "~^/(?<short_lat>-?(90(\.0+)?|[1-8]?\d(\.\d+)?)),(?<short_lon>-?(180(\.0+)?|1[0-7]\d(\.\d+)?|[1-9]?\d(\.\d+)?))/?$" "/?lat=$short_lat&lon=$short_lon";
        "~^/(?<short_reg>(?=.{3,8}$)(?=.*[A-Za-z])[A-Za-z0-9]+(-[A-Za-z0-9]+)?)/?$" "/?reg=$short_reg";
    }
    # A short link's own query, carried on after tar1090's.
    map $args $short_args {
        "" "";
        default "&$args";
    }

    # readsb's query API, which preview.lua asks of one aircraft (entrypoint.sh, from
    # TALLY_MAP_READSB_API).
    include /run/tally-map/readsb.conf;

    # The pictures (preview.py, on its socket) and the tiles they are drawn from, each cached on
    # the container's disk: a picture a minute, keyed on the aircraft and its rounded position; a
    # tile as long as OpenStreetMap's headers say, and at least a week. The disk each takes is
    # bounded; nginx forgets the least recently used first.
    proxy_cache_path /var/cache/tally-map/previews levels=1:2 keys_zone=previews:1m max_size=32m inactive=10m use_temp_path=off;
    proxy_cache_path /var/cache/tally-map/tiles levels=1:2 keys_zone=tiles:2m max_size=128m inactive=30d use_temp_path=off;
    limit_req_zone $everyone zone=tile_fetch:1m rate=10r/s;
    # The nameservers the tile server's name is looked up with (entrypoint.sh, from
    # /etc/resolv.conf), at each fetch, so nginx starts without them.
    include /run/tally-map/resolver.conf;

    # The tile server: OpenStreetMap's standard tiles, the layer tar1090 draws by default ('osm',
    # ol.source.OSM), or the server TALLY_MAP_TILES names (entrypoint.sh writes which), for
    # preview.py alone, on a socket only this image reaches. OpenStreetMap's
    # tile policy (operations.osmfoundation.org/policies/tiles) asks a client to name itself in its
    # User-Agent, to cache by the tiles' headers, and to keep its use light: every tile is cached,
    # one fetch of a tile at a time (proxy_cache_lock), and every ask held to 10 a second.
    server {
        listen unix:/run/tally-map/tiles.sock;
        access_log off;

        location ~ "^/\d{1,2}/\d{1,7}/\d{1,7}\.png$" {
            limit_req zone=tile_fetch burst=40;
            # $tile_origin and $tile_host.
            include /run/tally-map/tiles.conf;
            proxy_pass $tile_origin;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host $tile_host;
            proxy_set_header User-Agent "tally-map (link previews; +https://github.com/sky-commons/tally)";
            proxy_set_header Cookie "";
            proxy_cache tiles;
            proxy_cache_valid 200 7d;
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout updating;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location / {
            return 404;
        }
    }

    server {
        listen 8080 default_server;
        # [::]:8080 or nothing, by TALLY_MAP_IPV6 (entrypoint.sh).
        include /run/tally-map/listen-ipv6.conf;
        server_name _;

        # The page's class, every location's but those naming their own.
        include /run/tally-map/class-page.conf;
        error_page 429 @too_many;
        error_page 503 @busy;

        # Here, before any location, since a nested location runs none of its parent's `if`s.
        if ($archive_denied) {
            return 404;
        }
        # Empty, and so not sent, but on the archive's refusal above.
        add_header Cache-Control $archive_denied_cache always;

        location @too_many {
            add_header Retry-After $retry_after always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Retry-After" always;
            return 429;
        }
        location @busy {
            add_header Retry-After $retry_after always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Retry-After" always;
            return 503;
        }

        location /data/ {
            alias /run/readsb/;
            include /run/tally-map/class-live.conf;
            gzip_static off;
            add_header Access-Control-Allow-Origin "*" always;

            # add_header in a location replaces its parent's, so each one below says CORS again.
            location ~ aircraft\.json$ {
                add_header Cache-Control "no-cache";
                add_header Access-Control-Allow-Origin "*" always;
                gzip on;
                gzip_static on;
            }
            location /data/traces/ {
                add_header Access-Control-Allow-Origin "*" always;
                location ~ trace_recent {
                    gzip off;
                    add_header Cache-Control "no-cache";
                    add_header Content-Encoding "gzip";
                    add_header Access-Control-Allow-Origin "*" always;
                }
                location ~ trace_full {
                    gzip off;
                    add_header Cache-Control "no-cache";
                    add_header Content-Encoding "gzip";
                    add_header Access-Control-Allow-Origin "*" always;
                }
            }
            location ~ globe_.*\.json$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Content-Encoding "gzip";
                add_header Access-Control-Allow-Origin "*" always;
            }
            location ~ .*\.binCraft$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Content-Encoding "gzip";
                add_header Access-Control-Allow-Origin "*" always;
            }
            location ~ .*\.zst$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Access-Control-Allow-Origin "*" always;
            }
        }

        location /globe_history/ {
            alias /var/globe_history/;
            include /run/tally-map/class-history.conf;
            gzip on;
            gzip_static off;

            # readsb's own state (its traces across a restart) and the archives (served at
            # /archive/) share the volume; neither is served here. First, so no regex below
            # serves them.
            location ~ ^/globe_history/(internal_state|archive)(/|$) {
                return 404;
            }

            location ~ /acas/ {
                default_type text/plain;
                add_header Cache-Control "no-cache";
                gzip_static on;
            }

            location ~ traces/ {
                gzip off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }
            location ~ heatmap/ {
                gzip off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }
        }

        # Each finished UTC day's globe history as one tar (entrypoint.sh, the archiver), for the
        # open data releases (RFC-0187 §3). The listing names the days on hand, newest last, and
        # changes daily; an archive never changes once it is named. Each is public, or private
        # when the archive is closed (TALLY_MAP_ARCHIVE_PUBLIC=off), since a shared cache may keep
        # a public answer to a request that carried a token and hand it to anyone.
        location /archive/ {
            alias /var/globe_history/archive/;
            include /run/tally-map/class-archive.conf;
            autoindex on;
            autoindex_exact_size on;
            add_header Cache-Control "$archive_scope, max-age=60";

            # Half-written files and the archiver's record of the days packed are never served.
            location ~ (\.tmp$|^/archive/\.) {
                return 404;
            }
            location ~ \.tar$ {
                add_header Cache-Control "$archive_scope, max-age=1209600, immutable";
            }
            location ~ \.tar\.sha256$ {
                default_type text/plain;
                add_header Cache-Control "$archive_scope, max-age=1209600, immutable";
            }
        }

        # One aircraft's answer from readsb, for preview.lua alone. In half a second or not at all:
        # a page waits on it, and readsb is on loopback. A failure is logged with the page's
        # request, as nginx logs every subrequest's.
        location = /_readsb {
            internal;
            proxy_pass http://readsb_api/;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_connect_timeout 250ms;
            proxy_send_timeout 250ms;
            proxy_read_timeout 250ms;
        }

        # A link's picture (preview.py): the map around one aircraft, cached a minute and drawn
        # once for everyone who asks while it is drawn. preview.py draws one at a time and queues
        # two; one that waits past 10 s, is refused or cannot be drawn (no aircraft near that
        # position, a tile that never came) is answered the site's card. Its bytes are the page's
        # class's, and a visitor's share of /data/'s.
        location ~ "^/preview/~?[0-9a-f]{6}/-?\d{1,2}\.\d{2},-?\d{1,3}\.\d{2}\.jpg$" {
            limit_conn client_live 4;
            limit_req zone=client_req burst=40;
            proxy_pass http://unix:/run/tally-map/preview.sock;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            proxy_cache previews;
            proxy_cache_key $uri;
            proxy_cache_valid 200 60s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_intercept_errors on;
            error_page 404 500 502 503 504 = @card;
            add_header Cache-Control "public, max-age=60";
        }
        # The site's card, for a picture that could not be drawn: kept a minute, since the next
        # ask may draw it.
        location @card {
            root /usr/local/share/tally-map;
            try_files /card.jpg =404;
            add_header Cache-Control "public, max-age=60";
        }
        # The site's card, for a link with no aircraft: it never changes within a release.
        location = /card.jpg {
            root /usr/local/share/tally-map;
            add_header Cache-Control "public, max-age=1209600";
        }

        # A short link, with its own query after tar1090's, or the map's page for a path that is
        # not one.
        location @short {
            absolute_redirect off;
            error_page 404 /_404.html;
            if ($short_link = "") {
                return 404;
            }
            return 302 $short_link$short_args;
        }
        # The map's page for a path it does not have, in the site's style, back to the site.
        location = /_404.html {
            internal;
            root /usr/local/share/tally-map;
            try_files /404.html =404;
            add_header Cache-Control "no-cache";
        }

        # The page, at /: nginx serves it as /index.html (below) by an internal redirect, and a
        # request keeps the limits of the location it came in by, so they are stated here too.
        location = / {
            root /usr/local/share/tar1090/html;
            include /run/tally-map/class-page.conf;
            limit_conn client_live 4;
            limit_req zone=client_req burst=40;
        }

        location / {
            root /usr/local/share/tar1090/html;
            try_files $uri $uri/ @short;
            absolute_redirect off;
            error_page 404 /_404.html;

            # Written at start from the environment (entrypoint.sh), outside the read-only html.
            location = /config.js {
                alias /run/tally-map/config.js;
                add_header Cache-Control "no-cache";
            }
            # The page, asked for one aircraft, carries its preview: preview.lua sets
            # $preview_head to </head> and $preview to the tags, and sub_filter puts them before
            # it. Asked for none, both stay empty and the page is served as it is. Each preview
            # costs one question of readsb, so a visitor is held to the request rate /data/ is and
            # to its share of the live slots, which a page waiting on readsb holds.
            location = /index.html {
                add_header Cache-Control "no-cache";
                limit_conn client_live 4;
                limit_req zone=client_req burst=40;
                set $preview "";
                set $preview_head "";
                access_by_lua_file /usr/local/share/tally-map/preview.lua;
                sub_filter $preview_head "$preview</head>";
            }

            location ~ ^/style.*\.css$ {
                add_header Cache-Control "public, max-age=1209600";
            }

            location ~ ^/db-.*\.js$ {
                gzip off;
                gzip_static off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }

            location ~ ^/libs/.*$ {
                add_header Cache-Control "public, max-age=1209600";
            }
            location ~ ^/[^/]*\.js$ {
                add_header Cache-Control "public, max-age=1209600";
            }

            location /images {
                add_header Cache-Control "public, max-age=1209600";
            }
            location /flags {
                add_header Cache-Control "public, max-age=1209600";
            }
        }
    }
}
