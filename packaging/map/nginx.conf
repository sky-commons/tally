# nginx for the map image (RFC-0187 §1): tar1090 at /, readsb's JSON at /data/, the globe history
# at /globe_history/. The locations, their caching and their encodings are tar1090's own
# nginx-tar1090.conf at the pinned commit, installed at the web root (install.sh's "webroot"
# instance: /INSTANCE removed, SOURCE_DIR /run/readsb, HTMLPATH the installed html). Left out:
# /chunks/ (tar1090's history chunks, which a globe-indexed readsb replaces; the page's one probe
# of chunks/chunks.json is answered 404 and it carries on), /aircraft_sil/ and the offline tiles,
# which this image does not install, and the conf's rewrite of /globe_history/YYYY-MM-DD/ to
# YYYY/MM/DD/: tar1090 at the pinned commit asks for YYYY/MM/DD/ itself, and the rewrite's
# unanchored pattern would carry a `..` past nginx's normalisation into the alias.
#
# It runs as the image's user, not root, so everything it writes is under /run/tally-map, and
# entrypoint.sh starts it with `-e stderr` so it never opens Debian's root-owned log file.

worker_processes auto;
pid /run/tally-map/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # The map polls every second; a line a request would drown the log.
    access_log off;

    client_body_temp_path /run/tally-map/client_body;
    proxy_temp_path /run/tally-map/proxy;
    fastcgi_temp_path /run/tally-map/fastcgi;
    uwsgi_temp_path /run/tally-map/uwsgi;
    scgi_temp_path /run/tally-map/scgi;

    # What tar1090's conf switches on with `gzip on` is JSON; the files it marks gzip off are
    # already compressed (readsb's binCraft and traces, the database's .js), sent as they are.
    gzip_types application/json application/javascript text/css text/plain;
    gzip_vary on;

    server {
        listen 8080 default_server;
        # [::]:8080 or nothing, by TALLY_MAP_IPV6 (entrypoint.sh).
        include /run/tally-map/listen-ipv6.conf;
        server_name _;

        location /data/ {
            alias /run/readsb/;
            gzip_static off;
            add_header Access-Control-Allow-Origin "*" always;

            # add_header in a location replaces its parent's, so each one below says CORS again.
            location ~ aircraft\.json$ {
                add_header Cache-Control "no-cache";
                add_header Access-Control-Allow-Origin "*" always;
                gzip on;
                gzip_static on;
            }
            location /data/traces/ {
                add_header Access-Control-Allow-Origin "*" always;
                location ~ trace_recent {
                    gzip off;
                    add_header Cache-Control "no-cache";
                    add_header Content-Encoding "gzip";
                    add_header Access-Control-Allow-Origin "*" always;
                }
                location ~ trace_full {
                    gzip off;
                    add_header Cache-Control "no-cache";
                    add_header Content-Encoding "gzip";
                    add_header Access-Control-Allow-Origin "*" always;
                }
            }
            location ~ globe_.*\.json$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Content-Encoding "gzip";
                add_header Access-Control-Allow-Origin "*" always;
            }
            location ~ .*\.binCraft$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Content-Encoding "gzip";
                add_header Access-Control-Allow-Origin "*" always;
            }
            location ~ .*\.zst$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Access-Control-Allow-Origin "*" always;
            }
        }

        location /globe_history/ {
            alias /var/globe_history/;
            gzip on;
            gzip_static off;

            # readsb's own state (its traces across a restart) and the archives (served at
            # /archive/) share the volume; neither is served here. First, so no regex below
            # serves them.
            location ~ ^/globe_history/(internal_state|archive)(/|$) {
                return 404;
            }

            location ~ /acas/ {
                default_type text/plain;
                add_header Cache-Control "no-cache";
                gzip_static on;
            }

            location ~ traces/ {
                gzip off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }
            location ~ heatmap/ {
                gzip off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }
        }

        # Each finished UTC day's globe history as one tar (entrypoint.sh, the archiver), for the
        # open data releases (RFC-0187 §3). The listing names the days on hand, newest last, and
        # changes daily; an archive never changes once it is named.
        location /archive/ {
            alias /var/globe_history/archive/;
            autoindex on;
            autoindex_exact_size on;
            add_header Cache-Control "public, max-age=60";

            # Half-written files and the archiver's record of the days packed are never served.
            location ~ (\.tmp$|^/archive/\.) {
                return 404;
            }
            location ~ \.tar$ {
                add_header Cache-Control "public, max-age=1209600, immutable";
            }
            location ~ \.tar\.sha256$ {
                default_type text/plain;
                add_header Cache-Control "public, max-age=1209600, immutable";
            }
        }

        location / {
            root /usr/local/share/tar1090/html;
            try_files $uri $uri/ =404;
            absolute_redirect off;

            # Written at start from the environment (entrypoint.sh), outside the read-only html.
            location = /config.js {
                alias /run/tally-map/config.js;
                add_header Cache-Control "no-cache";
            }
            location = /index.html {
                add_header Cache-Control "no-cache";
            }

            location ~ ^/style.*\.css$ {
                add_header Cache-Control "public, max-age=1209600";
            }

            location ~ ^/db-.*\.js$ {
                gzip off;
                gzip_static off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }

            location ~ ^/libs/.*$ {
                add_header Cache-Control "public, max-age=1209600";
            }
            location ~ ^/[^/]*\.js$ {
                add_header Cache-Control "public, max-age=1209600";
            }

            location /images {
                add_header Cache-Control "public, max-age=1209600";
            }
            location /flags {
                add_header Cache-Control "public, max-age=1209600";
            }
        }
    }
}
