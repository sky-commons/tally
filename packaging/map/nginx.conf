# nginx for the map image (RFC-0187 §1): tar1090 at /, readsb's JSON at /data/, the globe history
# at /globe_history/. The locations, their caching and their encodings are tar1090's own
# nginx-tar1090.conf at the pinned commit, installed at the web root (install.sh's "webroot"
# instance: /INSTANCE removed, SOURCE_DIR /run/readsb, HTMLPATH the installed html). Left out:
# /chunks/ (tar1090's history chunks, which a globe-indexed readsb replaces; the page's one probe
# of chunks/chunks.json is answered 404 and it carries on), /aircraft_sil/ and the offline tiles,
# which this image does not install, and the conf's rewrite of /globe_history/YYYY-MM-DD/ to
# YYYY/MM/DD/: tar1090 at the pinned commit asks for YYYY/MM/DD/ itself, and the rewrite's
# unanchored pattern would carry a `..` past nginx's normalisation into the alias.
#
# What it sends is bounded by the operator's ceiling, TALLY_MAP_MAX_UPLOAD: entrypoint.sh derives
# each class's slots and rate from it and writes them to /run/tally-map, which this includes, so no
# figure of bytes is set here. The server's own class (the page) is every location's unless the
# location names another, so nothing it serves is outside the ceiling.
#
# It runs as the image's user, not root, so everything it writes is under /run/tally-map, and
# entrypoint.sh starts it with `-e stderr` so it never opens Debian's root-owned log file.

worker_processes auto;
pid /run/tally-map/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # The map polls every second; a line a request would drown the log.
    access_log off;

    client_body_temp_path /run/tally-map/client_body;
    proxy_temp_path /run/tally-map/proxy;
    fastcgi_temp_path /run/tally-map/fastcgi;
    uwsgi_temp_path /run/tally-map/uwsgi;
    scgi_temp_path /run/tally-map/scgi;

    # What tar1090's conf switches on with `gzip on` is JSON; the files it marks gzip off are
    # already compressed (readsb's binCraft and traces, the database's .js), sent as they are.
    gzip_types application/json application/javascript text/css text/plain;
    gzip_vary on;

    # The zones, who a client is (realip, behind a trusted proxy), and the archive's gate
    # (entrypoint.sh).
    include /run/tally-map/limits.conf;
    # A client over its rate is told 429; a class (or a client's share of it) with every slot busy
    # is 503. Each says when to come back (Retry-After, below). A refusal is logged at info, under
    # error_log's warn, since a scraper refused every second would drown the log.
    limit_req_status 429;
    limit_conn_status 503;
    limit_req_log_level info;
    limit_conn_log_level info;
    map $uri $retry_after {
        ~^/archive/ 60;
        ~^/globe_history/ 5;
        default 1;
    }

    # Closed (TALLY_MAP_ARCHIVE_PUBLIC=off), /archive/ is answered 404 without the token, and the
    # 404 is kept by no cache, so a cached refusal is never served to the release job that holds it.
    map "$archive_token_ok$uri" $archive_denied {
        default 0;
        ~^0/archive/ 1;
    }
    map $archive_denied $archive_denied_cache {
        1 no-store;
        default "";
    }

    server {
        listen 8080 default_server;
        # [::]:8080 or nothing, by TALLY_MAP_IPV6 (entrypoint.sh).
        include /run/tally-map/listen-ipv6.conf;
        server_name _;

        # The page's class, every location's but those naming their own.
        include /run/tally-map/class-page.conf;
        error_page 429 @too_many;
        error_page 503 @busy;

        # Here, before any location, since a nested location runs none of its parent's `if`s.
        if ($archive_denied) {
            return 404;
        }
        # Empty, and so not sent, but on the archive's refusal above.
        add_header Cache-Control $archive_denied_cache always;

        location @too_many {
            add_header Retry-After $retry_after always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Retry-After" always;
            return 429;
        }
        location @busy {
            add_header Retry-After $retry_after always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Retry-After" always;
            return 503;
        }

        location /data/ {
            alias /run/readsb/;
            include /run/tally-map/class-live.conf;
            gzip_static off;
            add_header Access-Control-Allow-Origin "*" always;

            # add_header in a location replaces its parent's, so each one below says CORS again.
            location ~ aircraft\.json$ {
                add_header Cache-Control "no-cache";
                add_header Access-Control-Allow-Origin "*" always;
                gzip on;
                gzip_static on;
            }
            location /data/traces/ {
                add_header Access-Control-Allow-Origin "*" always;
                location ~ trace_recent {
                    gzip off;
                    add_header Cache-Control "no-cache";
                    add_header Content-Encoding "gzip";
                    add_header Access-Control-Allow-Origin "*" always;
                }
                location ~ trace_full {
                    gzip off;
                    add_header Cache-Control "no-cache";
                    add_header Content-Encoding "gzip";
                    add_header Access-Control-Allow-Origin "*" always;
                }
            }
            location ~ globe_.*\.json$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Content-Encoding "gzip";
                add_header Access-Control-Allow-Origin "*" always;
            }
            location ~ .*\.binCraft$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Content-Encoding "gzip";
                add_header Access-Control-Allow-Origin "*" always;
            }
            location ~ .*\.zst$ {
                gzip off;
                add_header Cache-Control "no-cache";
                add_header Access-Control-Allow-Origin "*" always;
            }
        }

        location /globe_history/ {
            alias /var/globe_history/;
            include /run/tally-map/class-history.conf;
            gzip on;
            gzip_static off;

            # readsb's own state (its traces across a restart) and the archives (served at
            # /archive/) share the volume; neither is served here. First, so no regex below
            # serves them.
            location ~ ^/globe_history/(internal_state|archive)(/|$) {
                return 404;
            }

            location ~ /acas/ {
                default_type text/plain;
                add_header Cache-Control "no-cache";
                gzip_static on;
            }

            location ~ traces/ {
                gzip off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }
            location ~ heatmap/ {
                gzip off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }
        }

        # Each finished UTC day's globe history as one tar (entrypoint.sh, the archiver), for the
        # open data releases (RFC-0187 §3). The listing names the days on hand, newest last, and
        # changes daily; an archive never changes once it is named. Each is public, or private
        # when the archive is closed (TALLY_MAP_ARCHIVE_PUBLIC=off), since a shared cache may keep
        # a public answer to a request that carried a token and hand it to anyone.
        location /archive/ {
            alias /var/globe_history/archive/;
            include /run/tally-map/class-archive.conf;
            autoindex on;
            autoindex_exact_size on;
            add_header Cache-Control "$archive_scope, max-age=60";

            # Half-written files and the archiver's record of the days packed are never served.
            location ~ (\.tmp$|^/archive/\.) {
                return 404;
            }
            location ~ \.tar$ {
                add_header Cache-Control "$archive_scope, max-age=1209600, immutable";
            }
            location ~ \.tar\.sha256$ {
                default_type text/plain;
                add_header Cache-Control "$archive_scope, max-age=1209600, immutable";
            }
        }

        location / {
            root /usr/local/share/tar1090/html;
            try_files $uri $uri/ =404;
            absolute_redirect off;

            # Written at start from the environment (entrypoint.sh), outside the read-only html.
            location = /config.js {
                alias /run/tally-map/config.js;
                add_header Cache-Control "no-cache";
            }
            location = /index.html {
                add_header Cache-Control "no-cache";
            }

            location ~ ^/style.*\.css$ {
                add_header Cache-Control "public, max-age=1209600";
            }

            location ~ ^/db-.*\.js$ {
                gzip off;
                gzip_static off;
                add_header Cache-Control "public, max-age=1209600";
                add_header Content-Encoding "gzip";
            }

            location ~ ^/libs/.*$ {
                add_header Cache-Control "public, max-age=1209600";
            }
            location ~ ^/[^/]*\.js$ {
                add_header Cache-Control "public, max-age=1209600";
            }

            location /images {
                add_header Cache-Control "public, max-age=1209600";
            }
            location /flags {
                add_header Cache-Control "public, max-age=1209600";
            }
        }
    }
}
