# Every push to main and every pull request runs the whole build and its tests, as anyone cloning
# the repository would (RFC-0180 §6). GitHub's own runners: a pull request from a fork runs here with
# no credentials and nothing of anyone's infrastructure.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # v4.2.2, pinned by commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # 0.14.0, pinned by commit: Bazel at .bazelversion, and a disk cache kept between runs.
      # The pinned LLVM unpacks to several GB, more than the runner's root disk has free: Bazel's
      # output goes to the runner's second disk, and the SDKs Tally never uses go.
      - name: room for the toolchain
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo mkdir -p /mnt/bazel && sudo chown "$USER" /mnt/bazel
          echo 'startup --output_user_root=/mnt/bazel' >> ~/.bazelrc
          df -h / /mnt
      - uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # Two test binaries at a time: a runner has four slow cores, and a test's size is its deadline
      # with the cores it was measured on, not a share of four with everything else running.
      - run: bazel test --keep_going --lockfile_mode=error --test_output=errors --local_test_jobs=2 //...
      # Clippy over every Rust target, each warning an error (.bazelrc's `lint`).
      - run: bazel build --keep_going --lockfile_mode=error --config=lint //...
      # The release's cross builds, so a change that breaks one fails here and not on a tag: every
      # program for aarch64, the feeder for armv7 (release.yml).
      - run: |
          bazel build --lockfile_mode=error --platforms=//platforms:linux_aarch64 \
            //crates/feed:tally-feed //crates/relay:tally-relay //crates/api:tally-api
          bazel build --lockfile_mode=error --platforms=//platforms:linux_armv7 //crates/feed:tally-feed

  # The map image (packaging/map), built and run under Docker, which Bazel's tests do not have: its
  # pages, short links and link previews over HTTP (packaging/tests/map.sh).
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # v4.2.2, pinned by commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash packaging/tests/map.sh
