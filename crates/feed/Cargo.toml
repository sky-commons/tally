[package]
name = "tally-feed"
description = "Publishes a receiver's BEAST output to Tally relays (RFC-0171 §3.5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tally_feed"
path = "src/lib.rs"

[[bin]]
name = "tally-feed"
path = "src/main.rs"

[dependencies]
getrandom.workspace = true
# A container's root becomes its unprivileged user (src/privilege.rs).
libc.workspace = true
tally-wire.workspace = true
tokio.workspace = true

[dev-dependencies]
# `test-util` pauses time, so a test of a ten-minute wait waits no real seconds.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
