[package]
name = "tally-relay"
description = "A Tally relay: takes in feeders and peers, fans out to subscribers (RFC-0171 §3.6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tally_relay"
path = "src/lib.rs"

[[bin]]
name = "tally-relay"
path = "src/main.rs"

[dependencies]
axum.workspace = true
# The feeder figures' coverage cells and public cell centres (`figures`).
h3o.workspace = true
# A thread's scheduling priority (`mlat_host`: seals and window steps yield to provisional
# solving).
libc.workspace = true
serde.workspace = true
# One program (RFC-0174 §2.1): the relay hosts the MLAT engine for its areas (`mlat_host`).
tally-mlat.workspace = true
tally-mlat-solver.workspace = true
tally-wire.workspace = true
tokio.workspace = true

[dev-dependencies]
# The unit tests' counting allocator: test support, outside every production build.
tally-counting = { path = "../counting" }
serde_json.workspace = true
tally-feed = { path = "../feed" }
# `test-util` pauses time, so a deadline test waits no real seconds.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
