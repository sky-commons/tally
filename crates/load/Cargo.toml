[package]
name = "tally-load"
description = "Loads one Tally relay with many real feeders and measures what one subscriber receives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tally_load"
path = "src/lib.rs"

[[bin]]
name = "tally-load"
path = "src/main.rs"

[dependencies]
# The run's own ClockBound segment, written as the daemon writes one, which the spawned relay's
# judging clock is bounded by (`--clock-bound`): a relay that judges no time signs nothing.
clock-bound-shm = { workspace = true, features = ["writer"] }
libc.workspace = true
nix = { workspace = true, features = ["time"] }
serde_json.workspace = true
# Each simulated feeder is the feeder itself (`tally_feed::start`), not a copy of it.
tally-feed = { path = "../feed" }
# What the feeders hear: the MLAT simulator's receivers and aircraft (`sim`).
tally-mlat-solver.workspace = true
# The relay's own rules the harness's expectations follow (its deduplication window).
tally-relay.workspace = true
tally-wire.workspace = true
tokio.workspace = true

[lints]
workspace = true
