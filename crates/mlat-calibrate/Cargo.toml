[package]
name = "tally-mlat-calibrate"
description = "Calibrates the native MLAT against real receivers: an open dataset's receptions replayed through the engine a relay runs, with ADS-B aircraft withheld and scored against their own positions (RFC-0171 §3.8.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "tally_mlat_calibrate"
path = "src/lib.rs"

[[bin]]
name = "tally-mlat-calibrate"
path = "src/main.rs"

[dependencies]
blake2.workspace = true
tally-mlat.workspace = true
tally-mlat-solver.workspace = true
tally-wire.workspace = true

[lints]
workspace = true
